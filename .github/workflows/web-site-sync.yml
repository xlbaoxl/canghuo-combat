name: Sync verified Web site branch
on:
  workflow_run:
    workflows: ['Web playtest']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful main Web playtest run ID (must match current main)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: verified-web-site-branch
  cancel-in-progress: false
jobs:
  sync:
    if: >-
      github.repository == 'xlbaoxl/canghuo-combat' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Read trusted default-branch publishing code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: source
          persist-credentials: false
      - name: Authorize exact successful main run (never PR or fork artifacts)
        id: approved
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: python source/tools/web/site_sync.py inspect-run --run-id "$RUN_ID"
      - name: Download approved runtime only
        if: steps.approved.outputs.eligible == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-playable-release
          run-id: ${{ steps.approved.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved-web-release
      - name: Download matching verification evidence
        if: steps.approved.outputs.eligible == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-verification
          run-id: ${{ steps.approved.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/approved-web-evidence
      - name: Validate exact bytes and prepare runtime-only site
        if: steps.approved.outputs.eligible == 'true'
        env:
          SOURCE_SHA: ${{ steps.approved.outputs.commit }}
          RUN_ID: ${{ steps.approved.outputs.run_id }}
        run: |
          python source/tools/web/site_sync.py prepare --release "$RUNNER_TEMP/approved-web-release" --evidence "$RUNNER_TEMP/approved-web-evidence" --commit "$SOURCE_SHA" --run-id "$RUN_ID" --output "$RUNNER_TEMP/site-payload"
      - name: Read the existing dedicated site branch
        if: steps.approved.outputs.eligible == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: web-playtest-site
          path: site
          persist-credentials: true
      - name: Update generated branch without force pushing
        if: steps.approved.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.approved.outputs.commit }}
          RUN_ID: ${{ steps.approved.outputs.run_id }}
        run: |
          set -euo pipefail
          python source/tools/web/site_sync.py inspect-run --run-id "$RUN_ID" > "$RUNNER_TEMP/site-approval.json"
          if ! python -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["eligible"] else 1)' "$RUNNER_TEMP/site-approval.json"; then
            echo 'Main advanced while preparing this release; keeping the previous site branch.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          python source/tools/web/site_sync.py replace --package "$RUNNER_TEMP/site-payload" --target site
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add -A
          if git -C site diff --cached --quiet; then
            echo 'Verified site branch is already current.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Attribute the compiled source to its actual source author; automation is the committer.
          export GIT_AUTHOR_NAME="$(git -C source show -s --format=%an "$SOURCE_SHA")"
          export GIT_AUTHOR_EMAIL="$(git -C source show -s --format=%ae "$SOURCE_SHA")"
          git -C site commit -m "Publish verified Web runtime ${SOURCE_SHA:0:12}" -m "Generated by GitHub Actions from Web playtest $RUN_ID. Source author preserved; deployment and access protection require the owner's Vercel Git connection."
          git -C site push origin HEAD:refs/heads/web-playtest-site
          echo "Verified source $SOURCE_SHA copied to private branch web-playtest-site. This is not a live-hosting verification." >> "$GITHUB_STEP_SUMMARY"
