name: Combat migration R3
on:
  push:
    branches: [chore/complete-module-migration-r3-20261009]
    paths: ['.github/migration-r3-ticket.json']
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read only the exact authorized file
        run: |
          python - <<'PY'
          import hashlib,json,os,urllib.request,urllib.parse
          from pathlib import Path
          ticket=json.loads(Path('.github/migration-r3-ticket.json').read_text())
          url=ticket['url']
          p=urllib.parse.urlsplit(url)
          assert p.scheme=='https' and p.hostname=='raw.githubusercontent.com'
          assert p.path=='/xlbaoxl/canghuo-game/e101fca146bf340d8738dbaa3931c827e4efc227/modules/training-camp/project/scripts/combat_protocol.gd'
          print('::add-mask::'+url)
          out=Path(os.environ['RUNNER_TEMP'])/'transfer-check'
          out.mkdir(exist_ok=True)
          try:
              with urllib.request.urlopen(url,timeout=30) as r: raw=r.read(4096)
              assert len(raw)==1883
              assert hashlib.sha256(raw).hexdigest()=='33d72cf8f6f95c8c0962ed4d11a275df201c1b53b308c5cbba08aae0e43f0850'
              result={'status':'PASS','bytes':len(raw),'path':p.path}
          except Exception as e:
              result={'status':'FAIL','error_type':type(e).__name__,'http_status':getattr(e,'code',None)}
          (out/'result.json').write_text(json.dumps(result))
          print(json.dumps(result))
          if result['status']!='PASS':raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: combat-r3-transfer-check
          path: ${{ runner.temp }}/transfer-check
          retention-days: 3
