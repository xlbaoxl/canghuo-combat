name: Finalize exact research receipts
on:
  push:
    branches: [chore/publish-combat-source-r4-20261009]
    paths: ['.github/workflows/finalize-research-receipts.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify exact originals and complete their member receipts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('migration/research_members.json')
          m=json.loads(p.read_text())
          package=next(x for x in m['packages'] if x['source_artifact']=='combat_research_20260930_R4_final.zip')
          rows=package['members']
          generated={'scope':'All final research-package files except this manifest itself','files':[{'path':r['member'],'bytes':r['source_bytes'],'sha256':r['source_sha256']} for r in rows if r['member']!='data/file_manifest.json']}
          b=(json.dumps(generated,ensure_ascii=False,indent=2)+'\n').replace('\n','\r\n').encode()
          manifest_row=next(r for r in rows if r['member']=='data/file_manifest.json')
          assert len(b)==manifest_row['source_bytes'] and hashlib.sha256(b).hexdigest()==manifest_row['source_sha256']
          target=Path(manifest_row['destination'])
          assert not target.exists() or target.read_bytes()==b
          pending=[]
          for r in rows:
              f=Path(r['destination'])
              raw=b if r['member']=='data/file_manifest.json' else f.read_bytes() if f.is_file() else None
              if raw is None: continue
              assert len(raw)==r['source_bytes'] and hashlib.sha256(raw).hexdigest()==r['source_sha256'],r['member']
              if r['status']=='pending':
                  pending.append(r['member'])
                  r.update(status='archived',transform='identity',archived_bytes=r['source_bytes'],archived_sha256=r['source_sha256'])
          assert len(pending)==5, pending
          target.write_bytes(b)
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          print('Exact-byte members newly archived:',pending)
          PY
          python tools/validate_archive.py > "$RUNNER_TEMP/archive-finalized.json"
          python -m unittest discover -s tools/tests -v
      - name: Commit only checked originals and receipts without force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migration/research_members.json research/originals/combat_research_20260930_R4_final/data/file_manifest.json
          git commit -m 'archive: verify five additional original research records and preserve exact source bytes'
          git push origin HEAD:refs/heads/chore/publish-combat-source-r4-20261009
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: research-receipts-verification
          path: ${{ runner.temp }}/archive-finalized.json
          retention-days: 30
