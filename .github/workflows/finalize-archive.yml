name: Finalize checked combat research archive
on:
  push:
    branches: [chore/archive-and-source-r2b-20261009]
    paths: ['.github/finalize-archive.py', '.github/workflows/finalize-archive.yml']
permissions:
  contents: write
concurrency:
  group: combat-archive-finalize
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore only fingerprint-matched originals
        run: python .github/finalize-archive.py
      - name: Check integrity and its negative cases
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive-proof"
          python -m unittest discover -s tools/tests -v 2>&1 | tee "$RUNNER_TEMP/archive-proof/tests.log"
          python tools/validate_archive.py --output "$RUNNER_TEMP/archive-proof/validation.json"
          if python tools/validate_archive.py --require-complete --output "$RUNNER_TEMP/archive-proof/completeness.json"; then
            echo 'Unexpected full-migration claim' >&2
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'archive-proof'
          integrity=json.loads((p/'validation.json').read_text())
          complete=json.loads((p/'completeness.json').read_text())
          assert integrity['status']=='PASS'
          assert len(integrity['archived_members_checked'])==9
          assert len(integrity['pending_research_members'])==28
          assert not integrity['migration_complete'] and not integrity['engine_project_present']
          assert complete['status']=='FAIL'
          assert complete['errors']==['Migration is incomplete: declared missing artifacts/members/originals or unverified source']
          PY
      - name: Commit without overriding concurrent work
        env:
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=chore/archive-and-source-r2b-20261009
          CURRENT=$(git ls-remote origin refs/heads/$BRANCH | cut -f1)
          test "$CURRENT" = "$EXPECTED"
          git add .gitattributes README.md docs/实施状态与迁移清单.md research migration
          git rm .github/finalize-archive.py .github/workflows/finalize-archive.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'archive: preserve nine original reports and publish audited partial migration state'
          git push origin HEAD:refs/heads/$BRANCH
          git rev-parse HEAD > "$RUNNER_TEMP/archive-proof/verified-commit.txt"
          git archive --format=zip --output="$RUNNER_TEMP/archive-proof/canghuo-combat-documents.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-archive-r2-verified
          path: ${{ runner.temp }}/archive-proof
          retention-days: 14
          if-no-files-found: error
