name: Web playtest
on:
  push:
    branches: [main]
    paths: ['modules/training-camp/**', 'tools/web/**', 'tools/tests/test_web_*.py', '.github/workflows/web-playtest.yml', 'vercel.json']
  pull_request:
    paths: ['modules/training-camp/**', 'tools/web/**', 'tools/tests/test_web_*.py', '.github/workflows/web-playtest.yml', 'vercel.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-playtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Static and archive regression checks
        run: |
          python -m unittest discover -s tools/tests -v
          python tools/validate_archive.py
      - name: Install matching official engine and Web templates
        run: python tools/web/install_godot.py --dir "$RUNNER_TEMP/web-godot"
      - name: Build actual Web release and run authoritative rules
        run: python tools/web/build.py --engine "$RUNNER_TEMP/web-godot/godot" --output "$RUNNER_TEMP/web-release" --verify
      - name: Install pinned browser test runner
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Exercise the released WASM in a real browser
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout --kill-after=10s 600 xvfb-run -a -s '-screen 0 1600x1000x24' python tools/web/smoke.py --headed --graphics mesa --root "$RUNNER_TEMP/web-release" --output "$RUNNER_TEMP/web-browser-evidence"
      - name: Verify source stayed unchanged
        run: git diff --exit-code -- modules/training-camp/project
      - name: Validate the exact upload package without credentials or network writes
        run: |
          PYTHONPATH=tools/web python - <<'PY'
          import json, os
          from pathlib import Path
          from deploy_vercel import verified_files
          root = Path(os.environ['RUNNER_TEMP'])
          meta, files = verified_files(root / 'web-release', root / 'web-browser-evidence/browser-checks.json', root / 'web-release-evidence/build-result.json', os.environ['GITHUB_SHA'])
          assert 'index.storage.js' in files, 'Missing browser persistence observer'
          assert 'src="index.storage.js"' in files['index.html'].decode('utf-8'), 'HTML helper reference mismatch'
          receipt = {'commit': meta['commit'], 'verified_for_upload': True, 'files': sorted(files), 'bytes': sum(map(len, files.values())), 'network_writes': False, 'hosting_deployed': False}
          (root / 'web-release-evidence/upload-package.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Deploy verified release to the connected protected project
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.WEB_DEPLOY_ENABLED == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: |
          python tools/web/deploy_vercel.py --root "$RUNNER_TEMP/web-release" --browser-report "$RUNNER_TEMP/web-browser-evidence/browser-checks.json" --build-report "$RUNNER_TEMP/web-release-evidence/build-result.json" --commit "$GITHUB_SHA" --production --output "$RUNNER_TEMP/web-release-evidence/deployment.json"
      - name: Explain the deployment gate
        if: github.ref == 'refs/heads/main' && vars.WEB_DEPLOY_ENABLED != 'true'
        run: echo 'Web build and browser verification finished. Hosting is not enabled; no live URL is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-verification
          path: |
            ${{ runner.temp }}/web-release-evidence
            ${{ runner.temp }}/web-browser-evidence
            ${{ runner.temp }}/web-godot/receipt.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-playable-release
          path: ${{ runner.temp }}/web-release
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: web-unverified-candidate
          path: ${{ runner.temp }}/web-release
          retention-days: 2
          if-no-files-found: ignore
