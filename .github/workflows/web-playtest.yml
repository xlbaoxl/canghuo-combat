name: Web playtest
on:
  push:
    branches: [main]
    paths: ['modules/training-camp/**', 'tools/web/**', 'tools/tests/test_web_*.py', '.github/workflows/web-playtest.yml']
  pull_request:
    paths: ['modules/training-camp/**', 'tools/web/**', 'tools/tests/test_web_*.py', '.github/workflows/web-playtest.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-playtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Static and archive regression checks
        run: |
          python -m unittest discover -s tools/tests -v
          python tools/validate_archive.py
      - name: Install matching official engine and Web templates
        run: python tools/web/install_godot.py --dir "$RUNNER_TEMP/web-godot"
      - name: Build actual Web release and run authoritative rules
        run: python tools/web/build.py --engine "$RUNNER_TEMP/web-godot/godot" --output "$RUNNER_TEMP/web-release" --verify
      - name: Install pinned browser test runner
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Original browser regression before Pages adaptation
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout --kill-after=10s 600 xvfb-run -a -s '-screen 0 1600x1000x24' python tools/web/smoke.py --headed --graphics mesa --root "$RUNNER_TEMP/web-release" --output "$RUNNER_TEMP/web-browser-evidence"
      - name: Prepare the same game for headerless GitHub Pages
        run: python tools/web/pages.py --root "$RUNNER_TEMP/web-release" --evidence "$RUNNER_TEMP/web-release-evidence"
      - name: Verify actual Pages bundle on a headerless project subpath
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout --kill-after=10s 750 xvfb-run -a -s '-screen 0 1600x1000x24' python tools/web/pages_smoke.py --root "$RUNNER_TEMP/web-release" --output "$RUNNER_TEMP/pages-browser-evidence"
      - name: Verify source stayed unchanged and exact publication bytes
        run: |
          git diff --exit-code -- modules/training-camp/project
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/web')
          from deploy_vercel import verified_files
          temp = Path(os.environ['RUNNER_TEMP'])
          meta, files = verified_files(temp/'web-release', temp/'pages-browser-evidence/browser-checks.json', temp/'web-release-evidence/build-result.json', os.environ['GITHUB_SHA'])
          (temp/'web-release-evidence/pages-package.json').write_text(json.dumps({'commit':meta['commit'],'files':sorted(files),'network_writes':False,'hosting_deployed':False},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-verification
          path: |
            ${{ runner.temp }}/web-release-evidence
            ${{ runner.temp }}/web-browser-evidence
            ${{ runner.temp }}/pages-browser-evidence
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-playable-release
          path: ${{ runner.temp }}/web-release
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: web-unverified-candidate
          path: ${{ runner.temp }}/web-release
          retention-days: 2
          if-no-files-found: ignore
  pages:
    if: github.repository == 'xlbaoxl/canghuo-combat' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.repository.private == false
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - name: Download the exact tested runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-playable-release
          path: ${{ runner.temp }}/pages-runtime
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/pages-runtime
      - name: Deploy verified game
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Install browser for actual public URL validation
        run: |
          python -m pip install 'playwright==1.63.0'
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Play the actual HTTPS Pages release
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: timeout --kill-after=10s 900 xvfb-run -a -s '-screen 0 1600x1000x24' python tools/web/pages_smoke.py --url "$PAGE_URL" --expected-commit "$GITHUB_SHA" --output "$RUNNER_TEMP/pages-live-evidence"
      - name: Preserve actual hosting evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-live-verification
          path: ${{ runner.temp }}/pages-live-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Explain first-time Pages setup on failure
        if: failure()
        run: echo 'If Configure GitHub Pages failed, open this repository Settings > Pages > Build and deployment > Source, select GitHub Actions, then re-run the failed pages job. No Vercel account or token is needed. A successful deployment still needs the public browser check above.' >> "$GITHUB_STEP_SUMMARY"
