name: Web playtest
on:
  push:
    branches: [main, feat/web-playtest-20261010]
    paths: ['modules/training-camp/**', 'tools/web/**', 'tools/tests/test_web_build.py', '.github/workflows/web-playtest.yml', 'vercel.json']
  pull_request:
    paths: ['modules/training-camp/**', 'tools/web/**', 'tools/tests/test_web_build.py', '.github/workflows/web-playtest.yml', 'vercel.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-playtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Static and archive regression checks
        run: |
          python -m unittest discover -s tools/tests -v
          python tools/validate_archive.py
      - name: Install matching official engine and Web templates
        run: python tools/web/install_godot.py --dir "$RUNNER_TEMP/web-godot"
      - name: Build actual Web release and run authoritative rules
        run: python tools/web/build.py --engine "$RUNNER_TEMP/web-godot/godot" --output "$RUNNER_TEMP/web-release" --verify
      - name: Install pinned browser test runner
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Exercise the released WASM in a real browser
        run: python tools/web/smoke.py --root "$RUNNER_TEMP/web-release" --output "$RUNNER_TEMP/web-browser-evidence"
      - name: Verify source stayed unchanged
        run: git diff --exit-code -- modules/training-camp/project
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-verification
          path: |
            ${{ runner.temp }}/web-release-evidence
            ${{ runner.temp }}/web-browser-evidence
            ${{ runner.temp }}/web-godot/receipt.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-playable-release
          path: ${{ runner.temp }}/web-release
          retention-days: 14
          if-no-files-found: error
