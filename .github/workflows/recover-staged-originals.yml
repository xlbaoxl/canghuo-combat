name: Inspect existing staged archive objects
on:
  push:
    branches: [chore/publish-combat-source-r4-20261009]
    paths: ['migration/staging/**', '.github/workflows/recover-staged-originals.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect and preserve only uploaded archive chunks
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/archive-inspect"
          OUT="$RUNNER_TEMP/archive-inspect" python - <<'PY'
          import os,json,hashlib,zipfile,subprocess
          from pathlib import Path
          out=Path(os.environ['OUT'])
          rows=[]
          with zipfile.ZipFile(out/'chunks.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(Path('migration/staging').glob('p*.bin')):
                  b=p.read_bytes()
                  rows.append({'file':p.name,'bytes':len(b),'prefix':b[:12].hex(),'sha256':hashlib.sha256(b).hexdigest()})
                  z.writestr(p.name,b)
          (out/'metadata.json').write_text(json.dumps(rows,indent=2))
          subprocess.run(['git','archive','--format=zip','--output='+str(out/'documents.zip'),'HEAD','README.md','AGENTS.md','.gitattributes','.gitignore','.github','docs','migration','research','tools'],check=True)
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staged-originals-inspection
          path: ${{ runner.temp }}/archive-inspect
          retention-days: 3
          if-no-files-found: error
