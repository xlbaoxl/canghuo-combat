name: Import exact combat source
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: combat-fixed-source-r4
  cancel-in-progress: false
jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/publish-combat-source-r4-20261009' && contains(github.event.pull_request.body, '```combat-transfer')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact artifact and all destination bytes
        id: source
        run: python tools/import_fixed_github_artifact.py
      - name: Publish only verified combat paths
        if: steps.source.outputs.imported == 'true'
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BRANCH=chore/publish-combat-source-r4-20261009
          test "$(git ls-remote origin refs/heads/$BRANCH | cut -f1)" = "$EXPECTED"
          git -c core.autocrlf=false add modules/training-camp archive/game-e101fca migration/source_manifest.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: import exact 3.0.1 combat source and original project assets'
            git push origin HEAD:refs/heads/$BRANCH
          fi
          mkdir -p "$RUNNER_TEMP/receipt"
          cp migration/source_manifest.json "$RUNNER_TEMP/receipt/source_manifest.json"
          git rev-parse HEAD > "$RUNNER_TEMP/receipt/commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.source.outputs.imported == 'true'
        with:
          name: combat-fixed-source-receipt
          path: ${{ runner.temp }}/receipt
          retention-days: 14
          if-no-files-found: error
