[preset.0]
name="Training Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json"
exclude_filter="assets/**/*.prompt.txt,*.md"
export_path="../builds/CanghuoTraining.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
codesign/enable=false
application/modify_resources=false
application/product_name="Canghuo Training Camp"
application/file_description="Canghuo combat training demo 3.0.1"
application/file_version="3.0.1.0"
application/product_version="3.0.1.0"

[preset.1]
