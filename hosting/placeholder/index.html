<h1>托管连接已建立，游戏尚未发布</h1>
<p>这是一张不含游戏资源的设置页，不是试玩成功回执。</p>
<p>先在项目 <strong>Settings → Deployment Protection</strong> 中启用 <strong>Vercel Authentication → All Deployments</strong>，保存后再把 Production Branch 改为 <code>web-playtest-site</code>。</p>
<p>保留 Root Directory 为仓库根目录，勿把源码或文档目录设为静态输出。发布分支的配置会自动选择已验证的网页包。</p>
<p>不需要在 ChatGPT 内寻找授权弹窗，不需要下载工程或安装引擎。完成后把项目网址发回讨论，以便检查真实线上访问和试玩。</p></html>
