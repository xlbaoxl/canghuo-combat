<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>藏火 · 在线战斗训练营</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1519;color:#e8eadf}
*{box-sizing:border-box}body{margin:0}header,footer{max-width:1280px;margin:auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header strong{margin-right:auto}button{font:inherit;padding:7px 12px;border:1px solid #637367;border-radius:5px;background:#1b3436;color:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:2px solid #e5cb91;outline-offset:3px}
#frame{position:relative;width:min(100%,1280px);aspect-ratio:16/9;margin:auto;background:#102128}
#canvas{display:block;width:100%;height:100%;outline:none}#cover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;text-align:center;background:#102128;padding:24px}
#cover[hidden],#update[hidden]{display:none}#cover h1{font-size:32px;margin:0}#progress{width:min(400px,80%)}#message{max-width:640px;white-space:pre-wrap}footer{font-size:13px;color:#acbfb8}#update{max-width:1280px;margin:0 auto;padding:10px 16px;background:#433c21}dialog{max-width:720px;width:90%;border:1px solid #637367;border-radius:8px;background:#14272d;color:inherit}dialog textarea{width:100%;min-height:190px;resize:vertical;font:14px/1.6 system-ui;background:#0b1519;color:inherit;border:1px solid #637367;margin:10px 0}dialog .actions{display:flex;gap:10px;flex-wrap:wrap}#feedback-note{font-size:13px}#version{font-size:13px;color:#c9bd9c}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<header><strong>藏火 · 在线战斗训练营</strong><span id="version">版本读取中</span><button id="feedback" disabled>反馈本场问题</button><button id="fullscreen">全屏</button></header>
<div id="update" hidden>检测到新版本。当前对局不会自动刷新。<button id="reload">结束本场并载入新版</button></div>
<main id="frame"><canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="藏火战斗训练营游戏画面">浏览器需要支持 WebGL 2。</canvas><section id="cover"><h1>战斗训练营</h1><div id="message" role="status">电脑浏览器试玩。首次进入需要加载游戏资源。</div><progress id="progress" hidden></progress><button id="play">进入训练营</button></section></main>
<footer><span>1–4 选技能，再点目标确认；右键取消；空格结束窗口。</span><span id="storage" role="status">开战时保存本次配置；清理网站数据或隐私模式可能丢失。刷新将结束当前对局。</span></footer>
<dialog id="report"><h2>反馈本场问题</h2><p>在摘要后补充：你做了什么、实际发生了什么、期望是什么。</p><textarea id="summary" aria-label="反馈摘要"></textarea><div class="actions"><button id="copy">复制摘要</button><button id="download">下载完整诊断</button><button id="close-report">返回试玩</button></div><p id="feedback-note">诊断只在此浏览器生成，不会自动上传。摘要可直接发到讨论中。</p></dialog>
<script src="index.storage.js"></script>
<script src="index.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('canvas');
let loadedMeta=null, reportData='', reportName='canghuo-review.json', running=false;
const diagnostics=new URLSearchParams(location.search).has('diagnostics');
let lastHeartbeat=0;
window.canghuoErrors=[];
const storageMonitor=CanghuoStorage.createMonitor(CanghuoStorage.readPersisted, s=>{
 window.canghuoSaveStatus=s;
 if(s.state==='pending')$('storage').textContent='正在确认配置已保存，请勿立即刷新或关闭页面…';
 else if(s.state==='saved')$('storage').textContent='本次配置已保存到此浏览器。清理网站数据可能丢失；刷新仍会结束当前对局。';
 else if(s.state==='error')$('storage').textContent='保存未确认：'+s.error;
 if(diagnostics)console.debug('CANGHUO_SAVE '+JSON.stringify(s));
});
window.canghuoSaveStatus=storageMonitor.getStatus();
window.CanghuoWeb={
 requestReport:null,
 receiveSave(raw,path){void storageMonitor.request(raw,path);},
 saveFailed(error){storageMonitor.fail(error);},
 receiveStatus(raw){
  const s=JSON.parse(raw); window.canghuoStatus=s;
  if(diagnostics && performance.now()-lastHeartbeat>=1000){
   lastHeartbeat=performance.now();
   console.debug('CANGHUO_HEARTBEAT '+JSON.stringify({sample:s.sample,fps:s.fps,page:s.page,character:s.character,growth_profile:s.growth_profile,paused:s.paused,thinking:s.thinking,player_ready:s.player_ready,window_id:s.window_id,current:s.current,phase:s.phase,event_count:s.event_count,event_cursor:s.event_cursor,playback_wait:s.playback_wait}));
  }
  if(!loadedMeta){loadedMeta=s.build; $('version').textContent=`${s.build.version} · ${s.build.commit.slice(0,8)}`;}
  $('feedback').disabled=false;
  if(!s.persistent)$('storage').textContent='浏览器未提供持久存储；关闭页面后配装可能丢失，请保留诊断记录。';
 },
 receiveReport(raw,name){
  const r=JSON.parse(raw);r.browser_storage=storageMonitor.getStatus();
  reportData=JSON.stringify(r);reportName=name;
  $('summary').value=`【藏火网页试玩反馈】\n版本：${r.build.version} / ${r.build.commit}\n规则：${r.rules}；内容：${r.content}\n内容指纹：${r.content_digest}\n页面：${r.page}；对局：${r.state?.battle_id||'尚未开战'}\n种子：${r.snapshot?.seed??'未设定'}；窗口：${r.state?.window_id||'无'}\n保存状态：${r.browser_storage.state}\n\n问题描述：\n实际表现：\n期望表现：`;
  if(!$('report').open)$('report').showModal();
 }
};
$('feedback').onclick=()=>window.CanghuoWeb.requestReport?.();
$('close-report').onclick=()=>{$('report').close();canvas.focus();};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('summary').value);$('feedback-note').textContent='摘要已复制。完整事件与AI记录保留在诊断文件中。';}catch{ $('summary').focus();$('summary').select();$('feedback-note').textContent='浏览器拒绝剪贴板访问；请手动复制选中的摘要。';}};
$('download').onclick=()=>{if(!reportData)return;const u=URL.createObjectURL(new Blob([reportData],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=reportName;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000);};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('frame').requestFullscreen();canvas.focus();}catch(e){$('message').textContent=String(e);}};
canvas.addEventListener('contextmenu',e=>e.preventDefault());
function fail(e){const message=String(e?.message||e);window.canghuoErrors.push(message);$('cover').hidden=false;$('message').textContent='启动失败：'+message;$('play').disabled=true;}
window.addEventListener('error',e=>window.canghuoErrors.push(e.message));
window.addEventListener('unhandledrejection',e=>window.canghuoErrors.push(String(e.reason)));
window.addEventListener('beforeunload',e=>{if(storageMonitor.getStatus().state==='pending'){e.preventDefault();e.returnValue='';}});
$('play').onclick=async()=>{
 if(running)return;
 if(!window.isSecureContext||!window.crossOriginIsolated||typeof SharedArrayBuffer==='undefined'){fail('此部署缺少 HTTPS 或跨源隔离响应头，无法运行现有AI线程。请反馈部署问题。');return;}
 if(typeof Engine==='undefined'){fail('引擎脚本加载失败。请检查网络后刷新。');return;}
 running=true;$('play').disabled=true;$('progress').hidden=false;$('message').textContent='正在加载游戏资源…';
 try{const engine=new Engine({"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":36037024,"index.wasm":38820072},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});await engine.startGame({canvas,canvasResizePolicy:0,
 onProgress(current,total){if(total>0){$('progress').max=total;$('progress').value=current;$('message').textContent=`正在加载 ${Math.round(current/total*100)}%`; }},
 onPrintError(...args){const text=args.join(' ');console.error(text);window.canghuoErrors.push(text);},
 onExit(code){fail('游戏已退出（'+code+'）。请刷新后重试。');}
 });$('cover').hidden=true;canvas.focus();}catch(e){fail(e);}
};
// Revalidate the lightweight manifest; never replace an active game automatically.
async function checkUpdate(){if(!loadedMeta)return;try{const res=await fetch('build.json',{cache:'no-store'});if(!res.ok)return;const next=await res.json();if(next.commit!==loadedMeta.commit)$('update').hidden=false;}catch{}}
$('reload').onclick=()=>{
 const s=storageMonitor.getStatus();
 if(s.state==='pending'){alert('配置尚在保存，请在确认保存后再载入新版。');return;}
 const warning=s.state==='error'?'配置尚未确认保存，建议先下载诊断。仍要结束当前对局并刷新吗？':'载入新版会结束当前对局，确定继续？';
 if(confirm(warning))location.reload();
};
setInterval(checkUpdate,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate();});
</script>
</body>
</html>
